components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    InvalidRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required or the credentials are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The account or device is disabled, revoked, or not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist in the authenticated owner scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProjectNotFound:
      description: The project does not exist in the authenticated owner scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The target record already exists in an incompatible state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The authentication endpoint rate limit was exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTimeout:
      description: The request exceeded the service timeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadNotFound:
      description: The payload does not exist in the authenticated owner/project scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentHashMismatch:
      description: The raw-byte SHA-256 does not match contentHash.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CursorInvalid:
      description: The signed cursor is invalid or belongs to another owner/project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GenerationMismatch:
      description: The request belongs to another project generation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProjectMaintenance:
      description: The project does not currently accept sync traffic.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StorageUnavailable:
      description: RustFS is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentHash:
      name: contentHash
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    AfterSequence:
      name: afterSequence
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database, objectStore]
      properties:
        status:
          type: string
          enum: [live, ready, notReady]
        database:
          type: [boolean, 'null']
        objectStore:
          type: [boolean, 'null']
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, retryable, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorCode:
      type: string
      enum:
        - NOT_FOUND
        - INVALID_REQUEST
        - INTERNAL_ERROR
        - AUTHENTICATION_REQUIRED
        - AUTHORIZATION_DENIED
        - ACCOUNT_DISABLED
        - DEVICE_REVOKED
        - PROJECT_NOT_FOUND
        - PROJECT_MAINTENANCE
        - GENERATION_MISMATCH
        - REVISION_CONFLICT
        - CONTENT_HASH_MISMATCH
        - PAYLOAD_NOT_FOUND
        - PAYLOAD_TOO_LARGE
        - CURSOR_INVALID
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - REQUEST_TIMEOUT
        - INVALID_ACCOUNT_STATUS_TRANSITION
        - STORAGE_UNAVAILABLE
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        actualRevision:
          type: integer
          minimum: 1
        expectedGeneration:
          type: integer
          minimum: 1
        actualGeneration:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/ObjectKind'
        maxBytes:
          type: integer
          format: int64
          minimum: 0
        actualBytes:
          type: integer
          format: int64
          minimum: 0
    ObjectKind:
      type: string
      enum: [todo, classification, index, image]
    BootstrapRequest:
      type: object
      additionalProperties: false
      properties:
        pageToken:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 1000
    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [generation, items, hasMore, nextPageToken, cursor]
      properties:
        generation:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        hasMore:
          type: boolean
        nextPageToken:
          type: [string, 'null']
        cursor:
          type: [string, 'null']
    PullRequest:
      type: object
      additionalProperties: false
      required: [cursor]
      properties:
        cursor:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 1000
    PullResponse:
      type: object
      additionalProperties: false
      required: [generation, changes, nextCursor, hasMore]
      properties:
        generation:
          type: integer
          minimum: 1
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        nextCursor:
          type: string
        hasMore:
          type: boolean
    SyncChange:
      oneOf:
        - $ref: '#/components/schemas/SyncObjectChange'
        - $ref: '#/components/schemas/SyncTombstoneChange'
      discriminator:
        propertyName: type
    SyncObjectChange:
      type: object
      additionalProperties: false
      required: [type, kind, id, schemaVersion, revision, contentHash, updatedAt, deviceId, changeSequence]
      properties:
        type:
          const: object
        kind:
          $ref: '#/components/schemas/ObjectKind'
        id:
          type: string
