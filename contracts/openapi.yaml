openapi: 3.1.0
info:
  title: TaskTips Cloud API
  version: 0.1.0
  description: Contract-first API for TaskTips synchronization and administration.
  license:
    name: Proprietary
    identifier: LicenseRef-TaskTips-Proprietary
servers:
  - url: /
tags:
  - name: System
    description: Process health and internal observability endpoints.
  - name: Authentication
    description: Account and device authentication endpoints.
  - name: Projects
    description: Personal project metadata endpoints.
  - name: Devices
    description: Personal device registration and revocation endpoints.
  - name: Payloads
    description: Owner-scoped immutable payload byte transfer endpoints.
  - name: Synchronization
    description: Bootstrap, permanent change-log pull, and CAS push endpoints.
  - name: Administration
    description: Privacy-preserving system administration metadata endpoints.
paths:
  /openapi.yaml:
    get:
      operationId: getOpenApiDocument
      summary: Download the OpenAPI document
      tags: [System]
      security: []
      responses:
        '200':
          description: The current OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/openapi.yaml:
    get:
      operationId: getApiV1OpenApiDocument
      summary: Download the OpenAPI document
      tags: [System]
      security: []
      responses:
        '200':
          description: The current OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process can respond
      tags: [System]
      security: []
      responses:
        '200':
          description: The API process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check required service dependencies
      tags: [System]
      security: []
      responses:
        '200':
          description: PostgreSQL and RustFS are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      operationId: getMetrics
      summary: Export internal Prometheus metrics
      tags: [System]
      security: []
      responses:
        '200':
          description: OpenMetrics text. This endpoint is internal-only in deployment.
          content:
            application/openmetrics-text:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate a device
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access credentials for a regular user account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '408':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate a refresh token
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated access credentials for a regular user account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '408':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke all refresh tokens for the authenticated device
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The authenticated device sessions were revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/login:
    post:
      operationId: adminLogin
      summary: Authenticate a system administrator
      tags: [Administration]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Administrator access token and a Secure HttpOnly tasktips_admin_refresh cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTokenResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/auth/refresh:
    post:
      operationId: adminRefreshToken
      summary: Rotate the administrator refresh cookie
      tags: [Administration]
      security: []
      responses:
        '200':
          description: Rotated administrator access token and refresh cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTokenResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/auth/logout:
    post:
      operationId: adminLogout
      summary: Revoke the administrator device session
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The administrator device session was revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/re-auth:
    post:
      operationId: adminReauthenticate
      summary: Re-authenticate an administrator for a sensitive operation
      tags: [Administration]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReauthRequest'
      responses:
        '200':
          description: A short-lived, one-use operation nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/invitations/activate:
    post:
      operationId: activateInvitation
      summary: Activate an invited account
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationActivationRequest'
      responses:
        '200':
          description: The invited account was activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '408':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current account metadata
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/password:
    patch:
      operationId: changePassword
      summary: Change the current account password
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: The password was changed.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects owned by the current account
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projects visible through owner RLS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProject
      summary: Create a personal project
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Get an owned project
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owned project metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    patch:
      operationId: updateProject
      summary: Rename an owned project
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Updated project metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/projects/{projectId}/disable:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: disableProject
      summary: Disable an owned project without deleting history
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Disabled project metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/projects/{projectId}/purge:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: purgeProject
      summary: Verify the owner password and queue irreversible project deletion
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgeProjectRequest'
      responses:
        '202':
          description: Project deletion queued. The project enters deleting state immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeJob'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/projects/{projectId}/payloads/{contentHash}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ContentHash'
    head:
      operationId: headPayload
      summary: Check whether verified payload bytes exist in the owner project scope
      tags: [Payloads]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payload metadata. No object-store key or credential is returned.
          headers:
            Content-Length:
              schema:
                type: integer
                minimum: 0
            Content-Type:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PayloadNotFound'
        '423':
          $ref: '#/components/responses/ProjectMaintenance'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    put:
      operationId: putPayload
      summary: Upload and verify immutable payload bytes
      tags: [Payloads]
      security:
        - bearerAuth: []
      parameters:
        - name: Content-Length
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 10485760
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The verified payload is available under its content hash.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ContentHashMismatch'
        '423':
          $ref: '#/components/responses/ProjectMaintenance'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    get:
      operationId: getPayload
      summary: Stream payload bytes, optionally using a byte range
      tags: [Payloads]
      security:
        - bearerAuth: []
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Complete payload bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Requested payload byte range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PayloadNotFound'
        '416':
          $ref: '#/components/responses/InvalidRequest'
        '423':
          $ref: '#/components/responses/ProjectMaintenance'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/projects/{projectId}/sync/bootstrap:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: bootstrapSync
      summary: Read all heads and tombstones from a stable change sequence
      tags: [Synchronization]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: A stable bootstrap page. cursor is present only on the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/GenerationMismatch'
        '423':
          $ref: '#/components/responses/ProjectMaintenance'
  /api/v1/projects/{projectId}/sync/pull:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: pullSyncChanges
      summary: Pull permanent change-log entries after a signed cursor
      tags: [Synchronization]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequest'
      responses:
        '200':
          description: Incremental object and tombstone changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '400':
          $ref: '#/components/responses/CursorInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/GenerationMismatch'
        '423':
          $ref: '#/components/responses/ProjectMaintenance'
  /api/v1/projects/{projectId}/sync/push:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: pushSyncChanges
      summary: Push up to 100 object and tombstone CAS changes
      tags: [Synchronization]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Per-item applied, conflict, or rejected results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: Generation, bootstrap, or idempotency request-level rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          $ref: '#/components/responses/ProjectMaintenance'
  /api/v1/projects/{projectId}/history:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectHistory
      summary: List immutable owner-visible revision history
      tags: [Synchronization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ObjectKind'
      responses:
        '200':
          description: Revision metadata; object payloads remain available through the payload API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/projects/{projectId}/objects/{kind}/{objectId}/history:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectKind'
      - name: objectId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
    get:
      operationId: listObjectHistory
      summary: List immutable history for one object
      tags: [Synchronization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Revision metadata for the requested object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/projects/{projectId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listSnapshots
      summary: List immutable metadata-only snapshot references
      tags: [Synchronization]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot references without manifest bodies or storage credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    post:
      operationId: createSnapshot
      summary: Create an immutable snapshot of current heads
      tags: [Synchronization]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Snapshot manifest was verified and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '423':
          $ref: '#/components/responses/ProjectMaintenance'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/projects/{projectId}/restores:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createRestore
      summary: Queue a snapshot or change-sequence restore
      tags: [Synchronization]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '202':
          description: Restore job queued for the worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJob'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/projects/{projectId}/restores/{restoreId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: restoreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRestore
      summary: Read restore job status
      tags: [Synchronization]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current restore job state and counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{projectId}/restores/{restoreId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: restoreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelRestore
      summary: Cancel a queued or running restore
      description: Queued restores are cancelled immediately. Running restores stop at the next lease-checked boundary and leave no partial restore.
      tags: [Synchronization]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Restore cancellation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJob'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
