name: tasktips-cloud-dev

# Development-only stack: PostgreSQL + RustFS with fixed localhost credentials.
# The API and worker run on the host with deploy/env.dev.example defaults.
# Never use this file or its credentials for production.

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: tasktips
      POSTGRES_USER: tasktips
      POSTGRES_PASSWORD: ${TASKTIPS_DEV_POSTGRES_PASSWORD:-tasktips-dev}
    ports:
      - 127.0.0.1:${TASKTIPS_DEV_POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tasktips -d tasktips']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data-dev:/var/lib/postgresql
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${TASKTIPS_DEV_RUSTFS_ACCESS_KEY:-tasktips-dev}
      RUSTFS_SECRET_KEY: ${TASKTIPS_DEV_RUSTFS_SECRET_KEY:-tasktips-dev-secret}
    ports:
      - 127.0.0.1:${TASKTIPS_DEV_RUSTFS_PORT:-9000}:9000
      - 127.0.0.1:${TASKTIPS_DEV_RUSTFS_CONSOLE_PORT:-9001}:9001
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/health]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rustfs-data-dev:/data
    restart: unless-stopped

  rustfs-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set dev http://rustfs:9000 "$${TASKTIPS_DEV_RUSTFS_ACCESS_KEY}" "$${TASKTIPS_DEV_RUSTFS_SECRET_KEY}"
        mc mb --ignore-existing "dev/$${TASKTIPS_DEV_BUCKET}"
        mc ls "dev/$${TASKTIPS_DEV_BUCKET}" >/dev/null
    environment:
      TASKTIPS_DEV_RUSTFS_ACCESS_KEY: ${TASKTIPS_DEV_RUSTFS_ACCESS_KEY:-tasktips-dev}
      TASKTIPS_DEV_RUSTFS_SECRET_KEY: ${TASKTIPS_DEV_RUSTFS_SECRET_KEY:-tasktips-dev-secret}
      TASKTIPS_DEV_BUCKET: ${TASKTIPS_DEV_BUCKET:-tasktips-data}
    restart: 'no'

volumes:
  postgres-data-dev:
  rustfs-data-dev:
