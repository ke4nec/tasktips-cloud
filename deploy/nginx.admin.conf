server {
  listen 8080;
  # Dual-stack: containers often resolve localhost to ::1 first, and the
  # Compose healthcheck probes http://localhost:8080/health.
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

