name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins
      - name: Validate operational drill scripts
        run: |
          bash -n deploy/backup-drill.sh deploy/restore-failure-drill.sh tests/e2e/sync-smoke.sh
          sh -n deploy/backup.sh deploy/restore-drill.sh

  admin-and-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Verify generated client is committed
        working-directory: .
        run: git diff --exit-code -- admin/src/api/generated/schema.ts

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: tasktips
          POSTGRES_USER: tasktips
          POSTGRES_PASSWORD: tasktips-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasktips -d tasktips"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.3
        env:
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: 'false'
          RUSTFS_ACCESS_KEY: tasktips-test
          RUSTFS_SECRET_KEY: tasktips-test-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TASKTIPS_DATABASE_URL: postgres://tasktips:tasktips-test@localhost:5432/tasktips
      RUSTFS_ENDPOINT: http://localhost:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: tasktips-data
      RUSTFS_ACCESS_KEY: tasktips-test
      RUSTFS_SECRET_KEY: tasktips-test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --package tasktips-api -- migrate
      # Each integration suite assumes a clean database (fixed seed names such
      # as "User one" exist in several suites, and some assertions count rows
      # globally), so every suite after identity_rls gets its own database.
      # Without this, leftover rows from an earlier suite break later ones
      # (e.g. stage_b's admin project search finds identity_rls's project).
      - name: Create isolated test databases
        run: |
          container=$(docker ps --quiet --filter 'ancestor=postgres:18.6-bookworm')
          test -n "$container"
          docker exec "$container" psql -U tasktips -d tasktips -c 'CREATE DATABASE tasktips_stage_b'
          docker exec "$container" psql -U tasktips -d tasktips -c 'CREATE DATABASE tasktips_stage_c'
      - run: cargo test --locked --package tasktips-persistence --test identity_rls
      - run: cargo test --locked --package tasktips-api --test stage_b_api
        env:
          TASKTIPS_DATABASE_URL: postgres://tasktips:tasktips-test@localhost:5432/tasktips_stage_b
      - run: cargo test --locked --package tasktips-api --test stage_c_sync
        env:
          TASKTIPS_DATABASE_URL: postgres://tasktips:tasktips-test@localhost:5432/tasktips_stage_c

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: |
          mkdir -p deploy/secrets
          printf 'ci-placeholder-key' > deploy/secrets/tasktips_jwt_private_key
          cp deploy/env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: tasktips-backend:test
          load: true
          # Shares the Actions cache (one scope per image) with the Docker
          # Publish workflow so repeated builds reuse layers instead of
          # recompiling from scratch.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true
      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.admin
          tags: tasktips-admin:test
          load: true
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin,ignore-error=true
      - name: Smoke test API image
        run: |
          docker run --detach --name tasktips-api-smoke --env TASKTIPS_BIND_ADDRESS=0.0.0.0:8080 --publish 18080:8080 tasktips-backend:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health/live > /dev/null
          curl --fail --silent http://127.0.0.1:18080/openapi.yaml > /dev/null
      - name: Smoke test admin console image
        run: |
          docker run --detach --name tasktips-admin-smoke --publish 18081:8080 tasktips-admin:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/health
          curl --fail --silent http://127.0.0.1:18081/ | grep -qi '<!doctype html'
      - name: Smoke test worker and migrate binaries
        run: |
          docker run --rm tasktips-backend:test sh -c 'command -v tasktips-api && command -v tasktips-worker'
      # Remove the placeholder secret/env, the test image and dangling build
      # state so neither the workspace nor the runner disk keeps CI artifacts.
      - name: Clean up CI artifacts
        if: always()
        run: |
          docker rm --force tasktips-api-smoke tasktips-admin-smoke 2>/dev/null || true
          docker rmi --force tasktips-backend:test tasktips-admin:test 2>/dev/null || true
          rm -f deploy/.env deploy/secrets/tasktips_jwt_private_key
          docker buildx prune --force --keep-storage 2GB
          docker image prune --force
          docker system df
